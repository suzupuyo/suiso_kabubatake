<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター一覧</title>
    <link rel="stylesheet" href="./chara_style.css">
</head>

<body>
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                <div class="sidebar-header">
                    <h2 class="sidebar-title">Filters</h2>
                    <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
                </div>

                <button class="filter-btn active" onclick="filterCharacters('all', 'all')">すべて表示</button>
                <button class="filter-btn special-btn" onclick="filterCharacters('mainpc', 'role')">★メインPC</button>

                <div class="filter-group">
                    <h3>キーワード検索</h3>
                    <input type="text" id="search-input" class="search-box" placeholder="名前で検索..."
                        oninput="searchCharacters()">
                </div>


                <div class="filter-group">
                    <h3>並び替え</h3>
                    <select id="sort-select" class="filter-select" onchange="sortAndRender()">
                        <option value="id-desc">新着順</option>
                        <option value="id-asc">登録順</option>
                    </select>
                </div>

                <div class="filter-group">
                    <h3>ジャンル</h3>
                    <div id="genre-filters" class="v-button-list"></div>
                </div>

                <div class="filter-group">
                    <h3>参加タイトル</h3>
                    <div id="work-filters" class="v-button-list"></div>
                </div>

                <div class="filter-group">
                    <h3>活動年</h3>
                    <select id="year-select-filter" class="filter-select"
                        onchange="filterCharacters(this.value, 'year')">
                        <option value="all">すべての年</option>
                    </select>
                </div>
            </div>
        </aside>



        <main class="content-area">
            <header class="site-header">
                <button class="open-sidebar" onclick="toggleSidebar()">フィルター</button>
                <h1>Character List</h1>
            </header>


            <div class="character-list" id="character-list"></div>

            <div class="load-more-container" style="text-align: center; margin: 40px 0;">
                <button id="load-more-btn" class="filter-btn" onclick="loadMore()"
                    style="padding: 15px 40px; font-size: 1em;">More</button>
            </div>
        </main>
    </div>

    <script src="./js/chara_filter.js"></script>
</body>

</html>
